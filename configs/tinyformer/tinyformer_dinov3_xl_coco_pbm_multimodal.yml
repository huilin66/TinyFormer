__include__: [
  '../dataset/coco_detection.yml',
  '../runtime.yml',
  '../base/dataloader.yml',
  '../base/optimizer.yml',
  '../base/tinyformer.yml',
]

# One configuration switches IF/BF/SF/EF/NF/DF/FF and arbitrary n >= 1.
model: MultiModalTinyFormer
num_classes: 80
eval_spatial_size: [640, 640]

MultiModalTinyFormer:
  fusion_mode: EF
  num_modalities: 2
  modality_channels: [3, 3]
  modality_names: [modality_0, modality_1]
  share_weight: false
  model_input_channels: 3
  backbone: DINOv3BackboneStage
  ssa: SSA4ScaleStage
  neck: HybridEncoder_4Scale
  decoder: DEIMTransformer
  fusion: {type: AddFusion, normalize: true}
  image_fusion: {type: ConcatFusion, dim: 1}
  final_fusion: {type: AddFusion, normalize: true}

DINOv3BackboneStage:
  name: dinov3_vitb16
  weights_path: ./ckpts/dinov3_vitb16_pretrain_lvd1689m-73cec8be.pth
  interaction_indexes: [5, 8, 11]
  finetune: true

SSA4ScaleStage:
  embed_dim: 768
  hidden_dim: 384
  image_channels: 3
  use_adapter: true
  conv_inplane: 128

HybridEncoder_4Scale:
  in_channels: [384, 384, 384, 384]
  feat_strides: [4, 8, 16, 32]
  out_indices: [1, 2, 3]
  hidden_dim: 384
  use_encoder_idx: [3]
  num_encoder_layers: 1
  nhead: 8
  dim_feedforward: 1024
  dropout: 0.0
  enc_act: gelu
  expansion: 1.25
  depth_mult: 1.37
  act: silu
  version: deim
  csp_type: csp2
  fuse_op: sum

DEIMTransformer:
  num_layers: 6
  eval_idx: -1
  feat_channels: [384, 384, 384]
  hidden_dim: 256
  dim_feedforward: 2048

optimizer:
  type: AdamW
  params:
    - {params: '^(?=.*.dinov3)(?!.*(?:norm|bn|bias)).*$', lr: 0.000005}
    - {params: '^(?=.*.dinov3)(?=.*(?:norm|bn|bias)).*$', lr: 0.000005, weight_decay: 0.0}
    - {params: '^(?=.*(?:sda|neck|decoder))(?=.*(?:norm|bn|bias)).*$', weight_decay: 0.0}
  lr: 0.00025
  betas: [0.9, 0.999]
  weight_decay: 0.000125

train_dataloader:
  dataset:
    transforms:
      ops:
        - {type: Mosaic, output_size: 320, rotation_range: 10, translation_range: [0.1, 0.1], scaling_range: [0.5, 1.5], probability: 1.0, fill_value: 0, use_cache: true, max_cached_images: 50, random_pop: true}
        - {type: RandomPhotometricDistort, p: 0.5}
        - {type: RandomZoomOut, fill: 0}
        - {type: RandomIoUCrop, p: 0.8}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: RandomHorizontalFlip}
        - {type: Resize, size: [640, 640]}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: ConvertPILImage, dtype: float32, scale: true}
        - {type: Normalize, mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}
        - {type: ConvertBoxes, fmt: cxcywh, normalize: true}
      policy:
        epoch: [4, 29, 50]
  collate_fn:
    mixup_epochs: [4, 29]
    stop_epoch: 50
    copyblend_epochs: [4, 50]
    base_size_repeat: 3

val_dataloader:
  dataset:
    transforms:
      ops:
        - {type: Resize, size: [640, 640]}
        - {type: ConvertPILImage, dtype: float32, scale: true}
        - {type: Normalize, mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}
